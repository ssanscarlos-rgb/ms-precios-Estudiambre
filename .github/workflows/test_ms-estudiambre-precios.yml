name: Build and deploy Node.js app to Azure Web App - ms-estudiambre-precios

on:
  push:
    branches:
      - 'test'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Requerido para actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Correr pruebas
        run: npm test

      - name: Empaquetar (sin devDependencies)
        run: |
          npm prune --omit=dev
          zip -r release.zip . -x ".git/*" ".github/*" "test/*" "*.md"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Requerido para pedir el JWT de azure/login
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_140A3DAAEB94475C837429617841376E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DBC2A39CAC174A8997D38C4D537CAC26 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_888378C698BF4F4493590CFA52E81B68 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ms-estudiambre-precios'
          slot-name: 'Production'
          package: release.zip
